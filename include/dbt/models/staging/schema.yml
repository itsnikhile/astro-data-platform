version: 2

sources:
  - name: raw
    schema: raw
    description: "Raw ingestion layer — data lands here from the ingestion DAG."
    freshness:
      warn_after: { count: 1, period: hour }
      error_after: { count: 4, period: hour }
    loaded_at_field: _loaded_at
    tables:
      - name: events
        description: "Raw user events ingested from upstream sources."
        columns:
          - name: event_id
            description: "Unique identifier for each event."
            tests: [unique, not_null]
          - name: user_id
            tests: [not_null]
          - name: event_type
            tests: [not_null]
          - name: event_ts
            tests: [not_null]

models:
  - name: stg_events
    description: "Cleaned and deduplicated event records from raw.events."
    columns:
      - name: event_id
        tests: [unique, not_null]
      - name: user_id
        tests: [not_null]
      - name: event_type
        tests:
          - not_null
          - accepted_values:
              values: ['page_view', 'click', 'purchase', 'signup', 'logout']
      - name: event_ts
        tests: [not_null]
